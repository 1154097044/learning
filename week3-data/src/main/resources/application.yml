server:
  port: 8083

spring:
  application:
    name: week3-data
  datasource:
    # 本机 Docker 里的 MySQL 8.4 容器：库 learn，账号 root/root
    # 若报 Public Key Retrieval is not allowed，在 url 末尾追加 &allowPublicKeyRetrieval=true&useSSL=false
    url: jdbc:mysql://localhost:3306/learn?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10  # 最大连接数：单机项目5~20足够，太大MySQL扛不住
      minimum-idle: 5        # 空闲保底连接，避免突发流量冷启动
      connection-timeout: 30000 # 拿不到连接的等待上限(ms)，超时报 PoolTimeoutException
      max-lifetime: 1800000    # 连接最大存活30min，须小于MySQL wait_timeout(默认8h)
      idle-timeout: 600000     # 空闲10 min 回收 (不小于 minimum-idle)
      pool-name: LearnHikariPool # 给池命名，日志里好认
  jpa:
    hibernate:
      ddl-auto: validate    # 表结构交给Flyway，JPA只校验
    open-in-view: false     # 关闭 OSIV，逼自己在事务边界内加载数据
    properties:
      hibernate:
        format_sql: true   # 开发期打开 SQL 日志
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.xy.learning.week3: INFO
