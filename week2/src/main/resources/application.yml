server:
  port: 8082

spring:
  application:
    name: week2
  datasource:
    # 建库命令：docker exec -it mysql mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS learn_week2 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
    url: jdbc:mysql://localhost:3306/learn_week2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线列名 ↔ 驼峰字段自动转换（created_at ↔ createdAt）；实体 Todo.createdAt 依赖它
    map-underscore-to-camel-case: true
logging:
  level:
    com.xy.learning.week2: INFO   # 本模块包名是 week2（原误写 week3mp）
