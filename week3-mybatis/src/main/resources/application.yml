server:
  port: 8087

spring:
  application:
    name: week3-mybatis
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learn_mybatis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xy.learning.week3mybatis.model,com.xy.learning.week3mybatis.dto
  configuration:
    # 普通查询可按约定映射；联表使用显示 resultMap，避免同名列互相覆盖
    map-underscore-to-camel-case: true
    # 本模块不使用延迟加载，XML 联表结果在 Mapper 返回前组装完成。
    lazy-loading-enabled: false

logging:
  level:
    com.xy.learning.week3mybatis.mapper: DEBUG
