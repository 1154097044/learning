server:
  port: 8085

spring:
  application:
    name: week3-tx
  datasource:
    url: jdbc:mysql://localhost:3306/learn_tx?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate # 表结构交给 Flyway, JPA 只校验
    open-in-view: false
    show-sql: true       # 观察事务边界到底执行了几条 SQL，何时提交
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.xy.learning.week3tx: INFO
